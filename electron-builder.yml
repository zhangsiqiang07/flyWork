appId: com.flywork.app
productName: FlyDeck
copyright: Copyright © 2026 FlyDeck
directories:
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: dir
  icon: icon.icns
  category: public.app-category.developer-tools
  notarize: false
  identity: null
  extendInfo:
    NSDocumentsFolderUsageDescription: "FlyDeck 需要访问您的项目目录"
    NSDownloadsFolderUsageDescription: "FlyDeck 需要访问下载目录"
dmg:
  artifactName: FlyDeck-${version}-${arch}.${ext}
  title: FlyDeck ${version}
npmRebuild: false
publish: null
